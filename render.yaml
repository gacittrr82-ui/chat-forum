services:
  - type: web
    name: chat-forum
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chat-forum-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false

databases:
  - name: chat-forum-db
    plan: free
    databaseName: chatforum
    user: chatforum

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIDDEN SOCIETY Forums</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="loading" class="loading">
    <div class="loading-inner">
      <div class="brand-logo">🕶️</div>
      <p>Menghubungi Hidden Society...</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="layout">

      <!-- ======== Rail (seperti server list Discord) ======== -->
      <nav class="rail">
        <div class="rail-brand">🕶️</div>
        <div class="rail-modules">
          <button class="rail-btn" data-module="chat" title="Chat Forum">💬</button>
          <button class="rail-btn" data-module="help" title="Help Forum">🆘</button>
          <button class="rail-btn" data-module="voice" title="Voice">🎙️</button>
        </div>
      </nav>

      <!-- ======== Kolom channel ======== -->
      <aside class="channels">
        <div class="channels-header">
          <h2 id="channels-title">Chat Forum</h2>
        </div>

        <div class="channels-body">
          <div class="channel-section" id="channel-section">
            <div class="channel active" id="main-channel">
              <span class="channel-hash">#</span>
              <span id="channel-name">general</span>
            </div>
          </div>

          <!-- Panel voice (muncul saat modul Voice) -->
          <div class="voice-connected hidden" id="voice-connected">
            <div class="voice-connected-title">🔊 Voice Connected</div>
            <div class="voice-users" id="voice-users"></div>
            <div class="voice-controls">
              <button id="mic-btn" class="vc-btn on" title="Mic">🎤</button>
              <button id="deafen-btn" class="vc-btn" title="Deafen">🔇</button>
              <button id="screen-btn" class="vc-btn" title="Share Screen">🖥️</button>
              <button id="leave-voice-btn" class="vc-btn leave" title="Leave">📴</button>
            </div>
          </div>
        </div>

        <div class="channels-footer">
          <div class="user-chip" id="current-user">...</div>
          <div class="conn-status">
            <span id="conn-status">🔴</span>
            <span id="online-count">0 online</span>
          </div>
        </div>
      </aside>

      <!-- ======== Pane utama ======== -->
      <main class="pane">
        <div class="pane-header">
          <div>
            <h2 id="pane-title"># general</h2>
            <span class="pane-desc" id="pane-desc">Chat Forum</span>
          </div>
        </div>
        <div id="screen-grid" class="screen-grid hidden"></div>
        <div id="messages" class="messages"></div>
        <form id="chat-form" class="chat-input" autocomplete="off">
          <input type="text" id="chat-text" placeholder="Ketik pesan ke # general..." maxlength="2000" />
          <button type="submit" class="btn-primary">Kirim</button>
        </form>
      </main>

      <!-- ======== Panel member (seperti Discord) ======== -->
      <aside class="members-panel">
        <h3>ONLINE — <span id="member-count">0</span></h3>
        <ul id="member-list"></ul>
      </aside>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

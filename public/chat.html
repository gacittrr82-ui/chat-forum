<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Forum</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand brand-sm">
        <div class="brand-logo">&#128172;</div>
        <span class="brand-name">Chat Forum</span>
      </div>
      <div class="topbar-right">
        <span id="online-count" class="badge">&#128994; online</span>
        <span class="user-chip" id="current-user"></span>
        <button id="logout-btn" class="btn-ghost">Keluar</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h3>Ruangan</h3>
        <ul id="room-list"></ul>
      </aside>

      <main class="chat-pane">
        <div class="room-header">
          <h2 id="room-title">General</h2>
          <p id="room-desc"></p>
        </div>
        <div id="messages"></div>
        <form id="chat-form" class="chat-input">
          <input
            type="text"
            id="chat-text"
            placeholder="Ketik pesan, lalu Enter..."
            autocomplete="off"
            maxlength="2000"
          />
          <button type="submit" class="btn-primary">Kirim</button>
        </form>
      </main>
    </div>
  </div>

  <div id="loading" class="loading">Memuat...</div>

  <script src="socket.io/socket.io.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
